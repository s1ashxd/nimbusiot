worker_processes auto;
events { worker_connections 2048; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  server {
    listen 80;
    server_name nimbusiot.duckdns.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name nimbusiot.duckdns.org;
    root /usr/share/nginx/html;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/nimbusiot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimbusiot.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    resolver 127.0.0.11 valid=30s;
    set $api_host api;

    location /api/ {
      proxy_pass http://$api_host:3000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /ws {
      proxy_pass http://$api_host:3000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /health {
      proxy_pass http://$api_host:3000$request_uri;
    }

    location ~* \.(js|css|svg|woff2|woff|png|jpg|ico)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }
}
